spring:
  datasource:
    url: jdbc:h2:mem:catalog;DB_CLOSE_DELAY=-1;MODE=Oracle
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

security:
  jwt:
    issuer-uri: https://login.microsoftonline.com/test-tenant/v2.0
    audience: test-audience

internal:
  api-key: test-internal-key
